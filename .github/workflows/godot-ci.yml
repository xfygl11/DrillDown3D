name: Godot CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_godot_logic.py

  check-code:
    name: Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GDScript Syntax
        run: |
          echo "检查 GDScript 文件..."
          find scripts -name "*.gd" -exec grep -l "class_name" {} \; | wc -l
          echo "✓ 代码检查完成"

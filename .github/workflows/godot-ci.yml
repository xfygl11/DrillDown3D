name: Godot CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_godot_logic.py

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
      
      - name: Build APK
        run: |
          mkdir -p Builds
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --path . --export-release Android Builds/DrillDown3D.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrillDown3D
          path: Builds/DrillDown3D.apk

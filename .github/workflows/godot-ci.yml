# Godot CI/CD 工作流
name: Godot CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # 逻辑测试
  test:
    name: Run Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run Tests
        run: |
          python tests/test_godot_logic.py

  # Android 构建
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Download Godot Editor
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64
      
      - name: Create Export Presets
        run: |
          mkdir -p .godot/imported
          cat > export_presets.cfg << 'PRESETS'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          
          [preset.0.options]
          package/unique_name="com.drilldown3d.game"
          package/name="DrillDown 3D"
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          graphics/api=3
          graphics/min_api=24
          application/min_api=24
          application/target_api=33
          PRESETS
      
      - name: Build Android APK
        run: |
          ./Godot_v4.2.1-stable_linux.x86_64 \
            --headless \
            --path . \
            --export Android Builds/DrillDown3D.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrillDown3D-Android
          path: Builds/DrillDown3D.apk
          retention-days: 30
